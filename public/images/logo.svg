<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Gradient for Logo Icon -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 15)">
    <!-- Main Capsule/Shield Background with shadow-like effect -->
    <rect x="0" y="0" width="120" height="120" rx="32" fill="url(#grad)" />
    
    <!-- Stylized mortarboard / graduation cap inside -->
    <!-- Mortarboard Diamond -->
    <path d="M60,35 L95,50 L60,65 L25,50 Z" fill="#ffffff" />
    
    <!-- Cap Neck / Base -->
    <path d="M42,57.8 L42,70 C42,76 48,80 60,80 C72,80 78,76 78,70 L78,57.8 L60,65.5 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Dynamic Curve Swoosh (Learning Curve) wrapping around the cap -->
    <path d="M20,95 C45,105 75,105 100,95 C85,90 60,92 40,88 Z" fill="#ffffff" opacity="0.7" />
    
    <!-- Tassel -->
    <path d="M60,50 L85,62 L85,75" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="85" cy="77" r="3.5" fill="#ffffff" />
  </g>

  <!-- Logo Text -->
  <text x="155" y="75" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">Learning</text>
  <text x="345" y="75" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="url(#grad)" letter-spacing="-1">Curve</text>
  <text x="156" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#64748b" letter-spacing="4">LMS PORTAL</text>
</svg>
