services:
  - type: web
    name: learning-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Learning Curve"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # PostgreSQL external DB
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-dbv6jn8u01pc73cvlsf0-a
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: db_mt56
      - key: DB_USERNAME
        value: db_mt56_user
      - key: DB_PASSWORD
        value: wcDzmgoffuZJTg1exS82NK4DWv5ZhXJZ
      # Render URL — required for HTTPS session cookies
      - key: APP_URL
        value: https://learning-system-4.onrender.com
