services:
  - type: web
    name: learning-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    # Persistent disk — SQLite DB survives redeployments
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: "Learning Curve"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # SQLite DB on persistent disk
      - key: DB_DATABASE
        value: /var/data/database.sqlite
