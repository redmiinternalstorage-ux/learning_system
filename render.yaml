services:
  - type: web
    name: learning-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Learning Curve"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: learning-system
          property: host
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: learning-system-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: learning-system-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: learning-system-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: learning-system-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: learning-system-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: MAIL_MAILER
        value: log

databases:
  - name: learning-system-db
    plan: free
    databaseName: learning_system
    user: laravel
